<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪞 스마트 거울 비서 (Smart Mirror Assistant) - 2단계 AI 옷차림 분석</title>
  
  <!-- Environment Variables Script (Local dev fallback ignored by Git) -->
  <script src="env.js"></script>

  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem;">
    
    <!-- 1. Header Component Slot (Clock, Location, Weather Status) -->
    <div id="headerSlot" style="margin-bottom: 1.5rem;"></div>

    <!-- 2. Virtual Hardware Indicators Slot (Dot Matrix & Neopixel Bar) -->
    <div id="virtualIndicatorsSlot" style="margin-bottom: 1.5rem;"></div>

    <!-- 3. Main Split Content: Left (Webcam Viewfinder) | Right (AI Diagnosis Panel) -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      <!-- Left Panel: Webcam Viewfinder & Scan Button -->
      <div id="viewfinderSlot"></div>

      <!-- Right Panel: AI Diagnosis Pill Badge, Feedback & 4-Color Swatch -->
      <div id="diagnosisSlot"></div>
    </div>

    <!-- 4. Outfit Recommendation Gallery Slot -->
    <div id="gallerySlot"></div>

  </div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
