<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪞 스마트 거울 비서 (Smart Mirror Assistant) - 현재 위치 날씨</title>
  
  <!-- Environment Variables Script (Local dev fallback ignored by Git) -->
  <script src="env.js"></script>

  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div style="max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem;">
    
    <!-- 1. Header Component Slot (Clock, City, Weather Temp & Icon) -->
    <div id="headerSlot" style="margin-bottom: 1.5rem;"></div>

    <!-- 2. Virtual Hardware Indicators Slot (8x8 Dot Matrix) -->
    <div id="virtualIndicatorsSlot" style="margin-bottom: 1.5rem;"></div>

    <!-- 3. Weather Main Details Grid (Step 1 Core UI) -->
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
      
      <!-- Weather Info Main Glass Panel -->
      <div class="glass-panel animate-fade-in" style="padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--color-primary); display: flex; align-items: center; gap: 0.5rem;">
              <span>🌤️</span> 현재 위치 기반 실시간 기상 리포트
            </h2>
            <button id="btnRefreshLocation" class="btn-scan" style="font-size: 0.75rem; padding: 0.4rem 1rem;">
              🎯 내 현재 위치 날씨 감지
            </button>
          </div>

          <p style="font-size: 1rem; color: var(--color-text-main); line-height: 1.6; margin-bottom: 1.5rem;" id="weatherSummaryText">
            현재 위치(GPS) 및 날씨 데이터를 로딩하고 있습니다...
          </p>

          <!-- Weather Metrics Grid -->
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
            <div class="glass-card" style="text-align: center;">
              <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 0.25rem;">현재 기온</div>
              <div style="font-family: var(--font-mono); font-size: 1.75rem; font-weight: 700; color: var(--color-primary);" id="detailTemp">--°C</div>
            </div>
            <div class="glass-card" style="text-align: center;">
              <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 0.25rem;">체감 온도</div>
              <div style="font-family: var(--font-mono); font-size: 1.75rem; font-weight: 700; color: var(--color-secondary);" id="detailFeels">--°C</div>
            </div>
            <div class="glass-card" style="text-align: center;">
              <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 0.25rem;">현재 습도</div>
              <div style="font-family: var(--font-mono); font-size: 1.75rem; font-weight: 700; color: var(--color-accent);" id="detailHumidity">--%</div>
            </div>
          </div>
        </div>

        <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--color-text-muted); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-glass-border); padding-top: 0.75rem;">
          <span>📍 감지된 위치: <strong id="detailCityName" style="color: var(--color-text-main);">위치 수신 중...</strong></span>
          <span style="font-family: var(--font-mono);" id="lastUpdatedTime">최근 업데이트: --:--:--</span>
        </div>
      </div>

      <!-- Step Roadmap & Notice Glass Panel -->
      <div class="glass-panel animate-fade-in" style="padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--color-text-main); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>🚀</span> 프로젝트 진행 단계
          </h3>

          <div style="display: flex; flex-direction: column; gap: 0.875rem;">
            <div class="glass-card" style="border-left: 3px solid var(--color-success); background: rgba(16, 185, 129, 0.1);">
              <div style="font-weight: 700; font-size: 0.875rem; color: var(--color-success);">[1단계] 위치 기반 날씨 조회</div>
              <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-top: 0.2rem;">
                GPS 좌표 & OpenWeatherMap 연동 완료
              </div>
            </div>

            <div class="glass-card" style="opacity: 0.5;">
              <div style="font-weight: 600; font-size: 0.875rem; color: var(--color-text-muted);">[2단계] 웹캠 촬영 & AI 옷차림 분석</div>
              <div style="font-size: 0.75rem; color: var(--color-text-dim); margin-top: 0.2rem;">
                다음 단계 준비 중
              </div>
            </div>

            <div class="glass-card" style="opacity: 0.5;">
              <div style="font-weight: 600; font-size: 0.875rem; color: var(--color-text-muted);">[3단계] 아두이노 부품 제어</div>
              <div style="font-size: 0.75rem; color: var(--color-text-dim); margin-top: 0.2rem;">
                하드웨어 확장 단계
              </div>
            </div>
          </div>
        </div>

        <div style="margin-top: 1rem; font-size: 0.75rem; color: var(--color-text-dim); text-align: center;">
          📍 위치 정보는 동의 시 브라우저에서만 실시간으로 조회됩니다.
        </div>
      </div>

    </div>

  </div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
